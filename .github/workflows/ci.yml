name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch supersedes the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # npm 11 gates postinstall scripts. The `allowScripts` block in
      # package.json is what lets esbuild build itself here.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # The numerical core is the product foundation, so it runs before
      # anything that depends on a browser (docs/TEST_STRATEGY.md).
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright serves the production bundle, not the dev server, so these
      # verify what ships. It rebuilds first; the build above is here to fail
      # fast and on its own terms.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
